name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar o início aprovado
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check initial page script
        run: node --check inicio/app.js
      - name: Build only the approved initial page
        run: node scripts/build-inicio.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Publishing is an explicit manual decision; pushes and PRs only build.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publicar == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
